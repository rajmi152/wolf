<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Gaming - Creator Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: 'var(--accent-color, #10b981)',
                            glow: 'var(--accent-glow, rgba(16, 185, 129, 0.4))'
                        },
                        darkbg: '#0a0b0e',
                        cardbg: 'rgba(18, 20, 29, 0.85)'
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            background-color: #0a0b0e;
            color: #f3f4f6;
            font-family: 'Inter', sans-serif;
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .accent-glow {
            box-shadow: 0 0 25px var(--accent-glow);
        }
        
        .accent-border-glow:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .text-accent { color: var(--accent-color); }
        .bg-accent { background-color: var(--accent-color); }
        .border-accent { border-color: var(--accent-color); }

        .glass-panel {
            background: rgba(15, 18, 28, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0b0e; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }
        .live-ring { animation: pulse-ring 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- Háttérzene lejátszó -->
    <audio id="bg-audio" loop></audio>

    <!-- Háttér grid -->
    <div class="fixed inset-0 grid-bg pointer-events-none z-0"></div>
    <div class="fixed -top-40 -left-40 w-96 h-96 rounded-full blur-[120px] pointer-events-none z-0 opacity-30" style="background-color: var(--accent-color);"></div>

    <!-- Felső Navigációs Sáv -->
    <nav class="sticky top-0 z-40 glass-panel border-b border-white/10 px-6 py-3">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-accent flex items-center justify-center font-orbitron font-bold text-lg text-black shadow-lg">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <span id="nav-title" class="font-orbitron font-bold text-lg tracking-wider text-white">WOLF GAMING</span>
            </div>

            <div class="flex items-center gap-3">
                <!-- Élő adás jelző -->
                <div id="live-status-badge" class="hidden sm:flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold uppercase">
                    <span class="relative flex h-2 w-2">
                      <span class="live-ring absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    <span id="live-status-text">OFFLINE</span>
                </div>

                <!-- Zene Gomb -->
                <button id="music-toggle-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold font-rajdhani uppercase tracking-widest text-white transition-all accent-border-glow">
                    <i id="music-icon" class="fa-solid fa-music text-accent"></i>
                    <span id="music-text">Zene</span>
                </button>

                <!-- Téma Beállítása Gomb -->
                <button id="open-customizer-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold font-rajdhani uppercase tracking-widest text-white transition-all accent-border-glow">
                    <i class="fa-solid fa-sliders text-accent"></i>
                    <span>Téma</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Fő Tartalom -->
    <main class="relative z-10 max-w-6xl mx-auto px-4 py-8 w-full space-y-8 flex-grow">

        <!-- 1. Szekció: Profil & Fő Social Gombok -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Profil Kártya -->
            <div class="glass-panel rounded-3xl p-6 text-center flex flex-col items-center gap-4 relative overflow-hidden shadow-xl">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
                <div class="relative w-32 h-32 rounded-2xl overflow-hidden bg-slate-900 border-2 border-white/20 shadow-lg">
                    <img id="avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=400&auto=format&fit=crop&q=80" alt="Avatar" class="w-full h-full object-cover">
                </div>
                <div class="space-y-1">
                    <h1 id="creator-name" class="font-orbitron font-black text-2xl tracking-wide uppercase text-white">WOLF GAMING</h1>
                    <p id="creator-bio" class="text-gray-300 text-xs leading-relaxed">
                        Üdvözöllek a csatornámon! Napi szintű livestream-ek, gaming videók és közösség.
                    </p>
                </div>
            </div>

            <!-- Jobb oldali kártyák (YouTube & Discord & Socials) -->
            <div class="md:col-span-2 flex flex-col justify-between space-y-4">
                
                <!-- Nagy gombok -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <a id="link-youtube" href="https://youtube.com" target="_blank" class="glass-panel p-5 rounded-2xl border border-red-500/20 hover:border-red-500/60 flex items-center gap-4 transition-all group shadow-lg">
                        <div class="w-12 h-12 rounded-xl bg-red-600/20 border border-red-500/40 flex items-center justify-center text-red-500 text-xl group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-youtube"></i>
                        </div>
                        <div>
                            <h3 class="font-orbitron font-bold text-sm text-white group-hover:text-red-400">YouTube Csatorna</h3>
                            <p class="text-xs text-gray-400">Videók és élők</p>
                        </div>
                    </a>

                    <a id="link-discord" href="https://discord.com" target="_blank" class="glass-panel p-5 rounded-2xl border border-indigo-500/20 hover:border-indigo-500/60 flex items-center gap-4 transition-all group shadow-lg">
                        <div class="w-12 h-12 rounded-xl bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 text-xl group-hover:scale-110 transition-transform">
                            <i class="fa-brands fa-discord"></i>
                        </div>
                        <div>
                            <h3 class="font-orbitron font-bold text-sm text-white group-hover:text-indigo-300">Discord Szerver</h3>
                            <p class="text-xs text-gray-400">Lépj be a közösségbe</p>
                        </div>
                    </a>
                </div>

                <!-- További Social Bar -->
                <div class="glass-panel rounded-2xl p-4 flex flex-wrap justify-around gap-2 text-xs font-semibold">
                    <a id="link-twitch" href="https://twitch.tv" target="_blank" class="text-gray-300 hover:text-purple-400 transition-colors px-3 py-1 rounded-lg hover:bg-white/5"><i class="fa-brands fa-twitch text-purple-400"></i> Twitch</a>
                    <a id="link-tiktok" href="https://tiktok.com" target="_blank" class="text-gray-300 hover:text-cyan-400 transition-colors px-3 py-1 rounded-lg hover:bg-white/5"><i class="fa-brands fa-tiktok text-cyan-400"></i> TikTok</a>
                    <a id="link-facebook" href="https://facebook.com" target="_blank" class="text-gray-300 hover:text-blue-400 transition-colors px-3 py-1 rounded-lg hover:bg-white/5"><i class="fa-brands fa-facebook text-blue-400"></i> Facebook</a>
                    <a id="link-instagram" href="https://instagram.com" target="_blank" class="text-gray-300 hover:text-pink-400 transition-colors px-3 py-1 rounded-lg hover:bg-white/5"><i class="fa-brands fa-instagram text-pink-400"></i> Instagram</a>
                </div>

            </div>

        </div>

        <!-- 2. Szekció: Videó & Menetrend -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Videó Előnézet -->
            <div class="lg:col-span-2 space-y-3">
                <h2 class="font-orbitron font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-play text-accent"></i> Legújabb Videó / Stream
                </h2>
                <div class="glass-panel rounded-3xl p-3 shadow-2xl">
                    <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-black">
                        <iframe id="video-embed" class="w-full h-full border-0" 
                                src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" 
                                title="Featured Video" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                        </iframe>
                    </div>
                </div>
            </div>

            <!-- Menetrend -->
            <div class="space-y-3">
                <h2 class="font-orbitron font-bold text-base text-white flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-accent"></i> Stream Menetrend
                </h2>
                <div class="glass-panel rounded-3xl p-6 space-y-4 shadow-xl">
                    <div class="border-b border-white/10 pb-3">
