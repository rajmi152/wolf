<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Creator Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: 'var(--accent-color, #10b981)',
                            glow: 'var(--accent-glow, rgba(16, 185, 129, 0.4))'
                        },
                        darkbg: '#0a0b0e',
                        cardbg: 'rgba(18, 20, 29, 0.75)'
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.4);
        }

        body {
            background-color: #0a0b0e;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .grid-bg {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .accent-glow {
            box-shadow: 0 0 25px var(--accent-glow);
        }
        
        .accent-border-glow:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .text-accent { color: var(--accent-color); }
        .bg-accent { background-color: var(--accent-color); }
        .border-accent { border-color: var(--accent-color); }

        .glass-panel {
            background: rgba(15, 18, 28, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0b0e; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-color); }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(0.95); opacity: 0; }
        }
        .live-ring { animation: pulse-ring 2s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col justify-between relative selection:bg-emerald-500 selection:text-black">

    <!-- Rejtett audió elem háttérzenéhez -->
    <audio id="bg-audio" loop>
        <source src="https://commondatastorage.googleapis.com/codeskulptor-demos/riceracer_assets/music/race-chase.ogg" type="audio/ogg">
        A böngésződ nem támogatja az audió elemet.
    </audio>

    <div class="fixed inset-0 grid-bg pointer-events-none z-0"></div>
    <div id="ambient-glow-1" class="fixed -top-40 -left-40 w-96 h-96 rounded-full blur-[120px] pointer-events-none z-0 opacity-40 transition-colors duration-500" style="background-color: var(--accent-color);"></div>
    <div id="ambient-glow-2" class="fixed top-1/2 -right-40 w-96 h-96 rounded-full blur-[140px] pointer-events-none z-0 opacity-20 transition-colors duration-500" style="background-color: var(--accent-color);"></div>

    <nav class="sticky top-0 z-40 glass-panel border-b border-white/10 px-4 lg:px-8 py-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-accent flex items-center justify-center font-orbitron font-bold text-xl text-black shadow-lg shadow-black/50">
                    <i class="fa-solid font-bold fa-gamepad"></i>
                </div>
                <span id="nav-title" class="font-orbitron font-bold text-lg md:text-xl tracking-wider text-white">WOLF GAMING</span>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
                <button id="live-status-btn" class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-semibold uppercase tracking-wider">
                    <span class="relative flex h-2 w-2">
                      <span class="live-ring absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-red-500"></span>
                    </span>
                    <span id="live-status-text">OFFLINE</span>
                </button>

                <!-- Zene Lejátszó Gomb -->
                <button id="music-toggle-btn" class="flex items-center gap-2 px-3.5 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold font-rajdhani uppercase tracking-widest text-white transition-all accent-border-glow" title="Háttérzene ki/be">
                    <i id="music-icon" class="fa-solid fa-music text-accent"></i>
                    <span class="hidden md:inline" id="music-text">Zene</span>
                </button>

                <button id="open-customizer-btn" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-xs font-bold font-rajdhani uppercase tracking-widest text-white transition-all accent-border-glow">
                    <i class="fa-solid fa-sliders text-accent"></i>
                    <span class="hidden sm:inline">Téma beállítása</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="relative z-10 max-w-6xl mx-auto px-4 py-8 md:py-12 flex-grow w-full space-y-12">
        <section class="glass-panel rounded-3xl p-6 md:p-12 relative overflow-hidden text-center md:text-left flex flex-col md:flex-row items-center gap-8 md:gap-12">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>

            <div class="relative group">
                <div class="absolute -inset-1 rounded-2xl blur-md opacity-75 transition duration-500 group-hover:opacity-100" style="background-color: var(--accent-color);"></div>
                <div class="relative w-36 h-36 md:w-44 md:h-44 rounded-2xl overflow-hidden bg-slate-900 border-2 border-white/20 flex items-center justify-center">
                    <img id="avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=400&auto=format&fit=crop&q=80" alt="Creator Avatar" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://placehold.co/300x300/10b981/ffffff?text=AVATAR'">
                </div>
            </div>

            <div class="flex-1 space-y-4">
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-md bg-white/5 border border-white/10 text-xs font-mono text-gray-300">
                    <i class="fa-solid fa-code text-accent"></i> Content Creator & Streamer
                </div>
                <h1 id="creator-name" class="font-orbitron font-black text-3xl md:text-5xl tracking-wide uppercase text-white">
                    WOLF GAMING
                </h1>
                <p id="creator-bio" class="text-gray-300 font-sans text-base md:text-lg max-w-2xl leading-relaxed">
                    Üdvözöllek a csatornámon! Napi szintű livestream-ek, gaming videók, versenyek és tippek. Csatlakozz a közösséghez Discordon és YouTube-on!
                </p>

                <div class="pt-2 flex flex-wrap justify-center md:justify-start gap-4 text-xs font-rajdhani font-bold tracking-wider">
                    <div class="px-4 py-2 rounded-lg bg-black/40 border border-white/5 flex items-center gap-2">
                        <i class="fa-brands fa-youtube text-red-500 text-base"></i>
                        <span id="stat-subscribers">50K+ Feliratkozó</span>
                    </div>
                    <div class="px-4 py-2 rounded-lg bg-black/40 border border-white/5 flex items-center gap-2">
                        <i class="fa-brands fa-discord text-indigo-400 text-base"></i>
                        <span id="stat-discord">12
